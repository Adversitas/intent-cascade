name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,api]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Train and benchmark (CPU)
        run: |
          intent-cascade train --kind fasttext > train.log
          tail -n 12 train.log
          echo "## Test-set benchmark" >> "$GITHUB_STEP_SUMMARY"
          intent-cascade benchmark --output results/benchmark.json >> "$GITHUB_STEP_SUMMARY"

  postgres:
    # Exercises the pgvector store and the SQL prediction log against a real PostgreSQL.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intent
          POSTGRES_PASSWORD: intent
          POSTGRES_DB: intent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intent" --health-interval 2s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://intent:intent@localhost:5432/intent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,api,postgres]"
      - run: pytest -q tests/test_postgres.py
